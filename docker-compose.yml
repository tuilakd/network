services:
  mysql:
    image: mysql:8.0
    container_name: network-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${DB_NAME:-networkdb}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # (Tuỳ chọn) Giao diện trực quan xem cơ sở dữ liệu trên trình duyệt tại http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: network-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    ports:
      - "8081:80"

volumes:
  mysql_data:
    driver: local
