<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatWave – Quản trị</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="bg">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- ===== ĐĂNG NHẬP QUẢN TRỊ (tách riêng với đăng nhập người dùng) ===== -->
  <section id="adminAuth" class="auth hidden">
    <div class="auth-card glass">
      <div class="logo">
        <div class="logo-icon">🛡️</div>
        <h1>Chat<span>Wave</span> Admin</h1>
        <p>Khu vực dành cho quản trị viên</p>
      </div>

      <form id="adminLoginForm" class="form" autocomplete="off">
        <label class="field">
          <input type="text" id="adminUser" required placeholder=" " />
          <span>Tài khoản quản trị</span>
        </label>
        <label class="field">
          <input type="password" id="adminPass" required placeholder=" " />
          <span>Mật khẩu</span>
        </label>
        <button class="btn primary" type="submit"><span class="btn-text">Đăng nhập quản trị</span><i class="spinner"></i></button>
      </form>

      <p id="adminAuthError" class="auth-error"></p>
      <a class="admin-link" href="index.html">← Về trang nhắn tin</a>
    </div>
  </section>

  <!-- ===== TRANG QUẢN TRỊ ===== -->
  <main id="adminApp" class="admin glass hidden">
    <aside class="admin-side">
      <div class="brand">
        <span class="brand-icon">💬</span>
        <div><strong>ChatWave</strong><small>Quản trị</small></div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="users" type="button">👥 <span>Người dùng</span></button>
        <button class="nav-btn" data-view="logs" type="button">📜 <span>Nhật ký request</span></button>
      </nav>

      <div class="spacer"></div>

      <div class="side-foot">
        <div class="who">
          <div class="avatar sm" id="adminAvatar">A</div>
          <div><strong id="adminName">Admin</strong><small>Quản trị viên</small></div>
        </div>
        <div class="foot-actions">
          <button class="icon-btn" id="adminTheme" title="Đổi giao diện sáng/tối" type="button">🌓</button>
          <button class="icon-btn" id="adminLogout" title="Đăng xuất" type="button">🚪</button>
        </div>
      </div>
    </aside>

    <section class="admin-main">
      <header class="admin-head">
        <h2 id="viewTitle">Người dùng</h2>
        <button class="btn-sm" id="adminRefresh" type="button">⟳ Tải lại</button>
      </header>

      <div class="admin-body">
        <!-- Người dùng -->
        <div id="view-users" class="view">
          <div class="toolbar">
            <input type="text" id="userSearch" placeholder="Tìm theo tên hoặc tên đăng nhập..." />
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Người dùng</th><th>Email</th><th>Vai trò</th><th>Thao tác</th></tr></thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Nhật ký -->
        <div id="view-logs" class="view hidden">
          <div class="toolbar">
            <input type="text" id="logSearch" placeholder="Lọc theo đường dẫn, người dùng, trạng thái..." />
            <label class="check"><input type="checkbox" id="logAuto" /> Tự làm mới (5 giây)</label>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Thời gian</th><th>Method</th><th>Đường dẫn</th><th>Trạng thái</th><th>Người dùng</th><th>IP</th><th>Xử lý</th></tr></thead>
              <tbody id="logBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
