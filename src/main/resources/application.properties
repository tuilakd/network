# Cấu hình Tên ứng dụng & Cổng Server
spring.application.name=network
server.port=8080

# Cấu hình kết nối CSDL MySQL (networkdb)
spring.datasource.url=jdbc:mysql://localhost:3306/networkdb?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Tắt H2 console (đã chuyển sang dùng MySQL)
spring.h2.console.enabled=false

# Cấu hình bảo mật JWT
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-before-deploying-1234567890}
app.jwt.expiration-ms=86400000

# Cấu hình tải lên file (ảnh / ghi âm)
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình quản trị, CORS, WebSocket & Lưu trữ Log
app.admin.password=${ADMIN_PASSWORD:admin123}
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
app.ws.allowed-origins=
app.log.retention-days=30